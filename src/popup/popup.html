<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="icon" type="image/png" href="../icons/icon16.png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 300px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 14px;
      color: #24292f;
      background: #fff;
    }
    .header {
      padding: 16px;
      border-bottom: 1px solid #d0d7de;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .header h1 {
      font-size: 16px;
      font-weight: 600;
    }
    .content { padding: 16px; }
    .status {
      padding: 8px 12px;
      border-radius: 6px;
      margin-bottom: 12px;
      font-size: 13px;
    }
    .status-success { background: #dafbe1; color: #116329; }
    .status-error { background: #ffebe9; color: #82071e; }
    .status-inactive { background: #f6f8fa; color: #57606a; }
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
    }
    .toggle {
      position: relative;
      width: 40px;
      height: 22px;
    }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .toggle-slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background: #d0d7de;
      border-radius: 11px;
      transition: 0.2s;
    }
    .toggle-slider:before {
      content: "";
      position: absolute;
      height: 16px;
      width: 16px;
      left: 3px;
      bottom: 3px;
      background: white;
      border-radius: 50%;
      transition: 0.2s;
    }
    .toggle input:checked + .toggle-slider { background: #2da44e; }
    .toggle input:checked + .toggle-slider:before { transform: translateX(18px); }
    .info {
      font-size: 12px;
      color: #57606a;
      margin-top: 12px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="header">
    <span style="font-size: 20px;">📖</span>
    <h1>Markdown 阅读器</h1>
  </div>
  <div class="content">
    <div id="status" class="status status-inactive">未检测到 Markdown 页面</div>
    <div class="toggle-row">
      <span>启用渲染增强</span>
      <label class="toggle">
        <input type="checkbox" id="toggle" checked>
        <span class="toggle-slider"></span>
      </label>
    </div>
    <div class="info" id="adapter-info"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
